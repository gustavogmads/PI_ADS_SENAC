<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaCerta - Simular Sensor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        main {
            max-width: 560px;
            margin: 40px auto;
            padding: 24px;
        }

        .bloco {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 16px;
            font-size: 14px;
        }

        input,
        select,
        button {
            width: 100%;
            font: inherit;
        }

        input,
        select {
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fff;
        }

        button {
            margin-top: 20px;
            padding: 11px 14px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tempo {
            margin-top: 20px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f7f7f7;
        }

        .tempo span {
            display: block;
            color: #666;
            font-size: 13px;
        }

        .tempo strong {
            display: block;
            margin-top: 4px;
            font-size: 28px;
        }

        .explicacao {
            margin-top: 8px;
            font-size: 12px;
        }

        .mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            background: #eee;
        }

        .sucesso {
            background: #dff4e5;
        }

        .erro {
            background: #f1dddd;
        }

        .voltar {
            display: inline-block;
            margin-top: 18px;
            color: #222;
        }
    </style>
</head>
<body>

<main>
    <div class="bloco">
        <h1>Simular sensor</h1>

        <p>
            Informe apenas a quantidade de pessoas e produtos.
            O tempo de espera será calculado automaticamente pelo sistema.
        </p>

        <form id="formSensor">
            <label>
                Caixa
                <select id="caixaId" required></select>
            </label>

            <label>
                Pessoas na fila
                <input type="number" id="pessoas" min="0" value="3" required>
            </label>

            <label>
                Quantidade de produtos
                <input type="number" id="produtos" min="0" value="22" required>
            </label>

            <div class="tempo">
                <span>Tempo estimado</span>
                <strong id="tempoPrevisto">4 min</strong>

                <p class="explicacao">
                    A previsão considera a quantidade de pessoas e de produtos da fila.
                </p>
            </div>

            <button type="submit" id="btnEnviar">Enviar leitura</button>
        </form>

        <div id="mensagem" class="mensagem" hidden></div>

        <a class="voltar" href="index.html">Voltar ao painel administrativo</a>
    </div>
</main>

<script>
    const form = document.getElementById("formSensor");
    const caixaId = document.getElementById("caixaId");
    const pessoas = document.getElementById("pessoas");
    const produtos = document.getElementById("produtos");
    const tempoPrevisto = document.getElementById("tempoPrevisto");
    const btnEnviar = document.getElementById("btnEnviar");
    const mensagem = document.getElementById("mensagem");

    // Carrega os caixas cadastrados no painel.
    async function carregarCaixas() {
        try {
            const resposta = await fetch("api/dados.php", {
                cache: "no-store"
            });

            const dados = await resposta.json();
            const caixas = dados.caixas || [];

            caixaId.innerHTML = "";

            if (caixas.length === 0) {
                caixaId.innerHTML = '<option value="">Nenhum caixa cadastrado</option>';
                btnEnviar.disabled = true;
                mostrarMensagem("Cadastre pelo menos um caixa antes de simular.", false);
                return;
            }

            caixas.forEach((caixa) => {
                const opcao = document.createElement("option");

                opcao.value = caixa.id;
                opcao.textContent = `${caixa.nome} - ${caixa.aberto ? "Aberto" : "Fechado"}`;

                caixaId.appendChild(opcao);
            });

            btnEnviar.disabled = false;
        } catch (erro) {
            btnEnviar.disabled = true;
            mostrarMensagem("Não foi possível carregar os caixas.", false);
        }
    }

    // Esta prévia usa a mesma fórmula do PHP.
    // O valor final sempre é confirmado pelo servidor no envio.
    function calcularPrevia() {
        const quantidadePessoas = Math.max(0, Number(pessoas.value || 0));
        const quantidadeProdutos = Math.max(0, Number(produtos.value || 0));

        if (quantidadePessoas === 0 && quantidadeProdutos === 0) {
            tempoPrevisto.textContent = "0 min";
            return;
        }

        const tempo =
            (quantidadePessoas * 0.6) +
            (quantidadeProdutos * 0.08);

        tempoPrevisto.textContent = `${Math.ceil(tempo)} min`;
    }

    pessoas.addEventListener("input", calcularPrevia);
    produtos.addEventListener("input", calcularPrevia);

    // O simulador envia somente os dados que um sensor precisaria informar.
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const leitura = {
            caixaId: Number(caixaId.value),
            pessoas: Number(pessoas.value),
            produtos: Number(produtos.value)
        };

        try {
            const resposta = await fetch("api/atualizar-fila.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(leitura)
            });

            const dados = await resposta.json();

            if (!resposta.ok || !dados.ok) {
                mostrarMensagem(
                    dados.mensagem || "Não foi possível enviar a leitura.",
                    false
                );
                return;
            }

            tempoPrevisto.textContent = `${dados.tempoEstimado} min`;

            mostrarMensagem(
                `${dados.pessoas} pessoas, ${dados.produtos} produtos e ` +
                `${dados.tempoEstimado} min de espera calculados para o caixa.`,
                true
            );
        } catch (erro) {
            mostrarMensagem("Erro de comunicação com o servidor.", false);
        }
    });

    function mostrarMensagem(texto, sucesso) {
        mensagem.textContent = texto;
        mensagem.hidden = false;
        mensagem.className = sucesso ? "mensagem sucesso" : "mensagem erro";
    }

    carregarCaixas();
    calcularPrevia();
</script>

</body>
</html>
