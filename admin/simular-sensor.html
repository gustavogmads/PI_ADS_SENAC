<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaCerta - Simular Sensor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        main {
            max-width: 560px;
            margin: 40px auto;
            padding: 24px;
        }

        .bloco {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 16px;
            font-size: 14px;
        }

        input,
        select,
        button {
            width: 100%;
            font: inherit;
        }

        input,
        select {
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fff;
        }

        button {
            margin-top: 20px;
            padding: 11px 14px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            background: #eee;
        }

        .sucesso {
            background: #dff4e5;
        }

        .erro {
            background: #f1dddd;
        }

        .voltar {
            display: inline-block;
            margin-top: 18px;
            color: #222;
        }
    </style>
</head>
<body>

<main>
    <div class="bloco">
        <h1>Simular sensor</h1>
        <p>
            Use esta tela para enviar uma leitura como se ela tivesse vindo
            de um sensor instalado em um caixa.
        </p>

        <form id="formSensor">
            <label>
                Caixa
                <select id="caixaId" required></select>
            </label>

            <label>
                Pessoas na fila
                <input type="number" id="pessoas" min="0" value="3" required>
            </label>

            <label>
                Quantidade de produtos
                <input type="number" id="produtos" min="0" value="22" required>
            </label>

            <label>
                Tempo estimado de espera
                <input type="number" id="tempoEstimado" min="0" value="4" required>
            </label>

            <button type="submit" id="btnEnviar">Enviar leitura</button>
        </form>

        <div id="mensagem" class="mensagem" hidden></div>

        <a class="voltar" href="index.html">Voltar ao painel administrativo</a>
    </div>
</main>

<script>
    const form = document.getElementById("formSensor");
    const caixaId = document.getElementById("caixaId");
    const pessoas = document.getElementById("pessoas");
    const produtos = document.getElementById("produtos");
    const tempoEstimado = document.getElementById("tempoEstimado");
    const btnEnviar = document.getElementById("btnEnviar");
    const mensagem = document.getElementById("mensagem");

    // Carrega os caixas cadastrados no painel administrativo.
    async function carregarCaixas() {
        try {
            const resposta = await fetch("api/dados.php", {
                cache: "no-store"
            });

            const dados = await resposta.json();
            const caixas = dados.caixas || [];

            caixaId.innerHTML = "";

            if (caixas.length === 0) {
                caixaId.innerHTML = '<option value="">Nenhum caixa cadastrado</option>';
                btnEnviar.disabled = true;
                mostrarMensagem("Cadastre pelo menos um caixa no painel antes de simular.", false);
                return;
            }

            caixas.forEach((caixa) => {
                const opcao = document.createElement("option");

                opcao.value = caixa.id;
                opcao.textContent = `${caixa.nome} - ${caixa.aberto ? "Aberto" : "Fechado"}`;

                caixaId.appendChild(opcao);
            });

            btnEnviar.disabled = false;
        } catch (erro) {
            btnEnviar.disabled = true;
            mostrarMensagem("Não foi possível carregar os caixas.", false);
        }
    }

    // Envia os valores para o mesmo endereço que será usado pelo sensor real.
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const leitura = {
            caixaId: Number(caixaId.value),
            pessoas: Number(pessoas.value),
            produtos: Number(produtos.value),
            tempoEstimado: Number(tempoEstimado.value)
        };

        try {
            const resposta = await fetch("api/atualizar-fila.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(leitura)
            });

            const dados = await resposta.json();

            if (!resposta.ok || !dados.ok) {
                mostrarMensagem(dados.mensagem || "Não foi possível enviar a leitura.", false);
                return;
            }

            mostrarMensagem(
                `Leitura enviada. Caixa ${leitura.caixaId}: ` +
                `${leitura.pessoas} pessoas, ${leitura.produtos} produtos e ` +
                `${leitura.tempoEstimado} min de espera.`,
                true
            );
        } catch (erro) {
            mostrarMensagem("Erro de comunicação com o servidor.", false);
        }
    });

    function mostrarMensagem(texto, sucesso) {
        mensagem.textContent = texto;
        mensagem.hidden = false;
        mensagem.className = sucesso ? "mensagem sucesso" : "mensagem erro";
    }

    carregarCaixas();
</script>

</body>
</html>
